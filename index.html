<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EcoSort AI</title>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #eaf7ee;
            margin: 0;
            padding: 25px;
        }

        h1 {
            color: #218c4a;
            font-size: 32px;
        }

        h2 {
            color: #333;
        }

        p {
            font-size: 18px;
        }

        button {
            background: #218c4a;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;
            margin: 15px;
        }

        button:hover {
            background: #176b38;
        }

        #camera {
            margin-top: 20px;
        }

        #resultado {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin: 20px auto;
            max-width: 400px;
            font-size: 20px;
            font-weight: bold;
        }

        #reiniciar {
            display: none;
        }
    </style>
</head>

<body>

    <div id="inicio">
        <h1>♻️ EcoSort AI</h1>

        <h2>Tacho inteligente</h2>

        <p>
            Acerca tu residuo y presiona <b>COMENZAR</b>.
        </p>

        <button id="comenzar" onclick="iniciar()">
            COMENZAR
        </button>
    </div>

    <div id="app" style="display:none;">

        <h1>♻️ EcoSort AI</h1>

        <div id="camera"></div>

        <div id="resultado">
            Esperando residuo...
        </div>

        <button id="reiniciar" onclick="location.reload()">
            VOLVER A COMENZAR
        </button>

    </div>

<script>

    // MODELO DE TEACHABLE MACHINE
    const URL = "https://teachablemachine.withgoogle.com/models/y9AIk9YfX/";

    // ESTE CELULAR ES EL TACHO DE ORGÁNICOS
    const TACHO = "organico";

    let model;
    let webcam;
    let maxPredictions;


    // INICIAR LA APP
    async function iniciar() {

        console.log("Botón COMENZAR presionado");

        document.getElementById("inicio").style.display = "none";
        document.getElementById("app").style.display = "block";

        try {

            document.getElementById("resultado").innerHTML =
                "⏳ Cargando cámara...";

            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            model = await tmImage.load(modelURL, metadataURL);

            maxPredictions = model.getTotalClasses();

            webcam = new tmImage.Webcam(300, 300, true);

            await webcam.setup();

            await webcam.play();

            document.getElementById("camera").appendChild(webcam.canvas);

            document.getElementById("resultado").innerHTML =
                "📷 Cámara lista.<br><br>Acerca un residuo.";

            document.getElementById("reiniciar").style.display = "inline-block";

            window.requestAnimationFrame(loop);

        } catch (error) {

            console.error(error);

            document.getElementById("resultado").innerHTML =
                "❌ No se pudo iniciar la cámara.<br><br>" +
                "Revisa que hayas permitido el acceso a la cámara.";

        }
    }


    // REPETIR LA RECONOCIMIENTO
    async function loop() {

        if (webcam) {

            webcam.update();

            await predecir();

            window.requestAnimationFrame(loop);
        }
    }


    // RECONOCER EL RESIDUO
    async function predecir() {

        const predicciones = await model.predict(webcam.canvas);

        let mayor = predicciones[0];

        for (let i = 1; i < predicciones.length; i++) {

            if (
                predicciones[i].probability >
                mayor.probability
            ) {
                mayor = predicciones[i];
            }
        }

        const clase = mayor.className.toLowerCase();

        const confianza =
            Math.round(mayor.probability * 100);


        // NOMBRES BONITOS PARA MOSTRAR
        const nombres = {
            organico: "orgánico",
            plastico: "plástico",
            carton: "cartón"
        };


        const nombreResiduo =
            nombres[clase] || mayor.className;


        // SI CORRESPONDE A ESTE TACHO
        if (clase === TACHO) {

            document.getElementById("resultado").innerHTML =

                "✅ ¡Este residuo va aquí!<br><br>" +

                "Es " + nombreResiduo + ".<br>" +

                "Introduce tu desecho en este tacho.<br><br>" +

                "Precisión: " + confianza + "%";

        }

        // SI NO CORRESPONDE
        else {

            document.getElementById("resultado").innerHTML =

                "❌ Este residuo no va aquí.<br><br>" +

                "Es " + nombreResiduo + ".<br><br>" +

                "Busca el tacho correspondiente.<br><br>" +

                "Precisión: " + confianza + "%";
        }

    }

</script>

</body>
</html>
