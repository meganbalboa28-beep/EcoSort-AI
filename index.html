const URL =
"https://teachablemachine.withgoogle.com/models/y9AIk9YfX/";



// =====================================
// ESTE CELULAR ES EL TACHO ORGÁNICO

const TACHO = "organico";



let model = null;

let webcam = null;

let iniciada = false;



// =====================================
// BOTÓN COMENZAR
// =====================================

document
.getElementById("comenzar")
.addEventListener(
    "click",
    iniciar
);



async function iniciar() {


    // Evita abrir dos cámaras

    if (iniciada) {

        return;

    }


    iniciada = true;


    // Ocultar inicio

    document
    .getElementById("inicio")
    .style.display = "none";


    // Mostrar aplicación

    document
    .getElementById("app")
    .style.display = "block";


    document
    .getElementById("resultado")
    .innerHTML =
    "⏳ Cargando modelo...";


    try {


        // Cargar modelo

        const modelURL =
        URL + "model.json";


        const metadataURL =
        URL + "metadata.json";


        model =
        await tmImage.load(
            modelURL,
            metadataURL
        );


        // Crear cámara

        webcam =
        new tmImage.Webcam(
            300,
            300,
            true
        );


        // Pedir permiso

        await webcam.setup();


        // Encender cámara

        await webcam.play();


        // Mostrar cámara

        document
        .getElementById("camara")
        .appendChild(
            webcam.canvas
        );


        document
        .getElementById("resultado")
        .innerHTML =

        "📷 <b>Cámara lista.</b><br><br>" +

        "Acerca un residuo.";


        // Empezar reconocimiento

        detectar();


    }

    catch (error) {


        console.error(error);


        document
        .getElementById("resultado")
        .innerHTML =

        "❌ No se pudo iniciar la cámara.";


        iniciada = false;

    }

}



// =====================================
// RECONOCIMIENTO CONTINUO
// =====================================

async function detectar() {


    if (!webcam || !model) {

        return;

    }


    // Actualizar imagen de cámara

    webcam.update();


    // Analizar imagen

    const predicciones =

    await model.predict(
        webcam.canvas
    );


    // Buscar la clase con mayor confianza

    let mayor =
    predicciones[0];


    for (
        let i = 1;
        i < predicciones.length;
        i++
    ) {


        if (

            predicciones[i].probability >

            mayor.probability

        ) {


            mayor =
            predicciones[i];

        }

    }


    // Nombre de la clase

    const clase =

    mayor.className
    .toLowerCase();


    // Porcentaje de confianza

    const confianza =

    mayor.probability * 100;



    // =================================
    // CONFIANZA BAJA
    // =================================

    if (confianza < 80) {


        document
        .getElementById("resultado")
        .innerHTML =

        "📷 <b>Acerca un residuo a la cámara.</b><br><br>" +

        "Esperando para reconocerlo...";


        document
        .getElementById("desechar")
        .style.display = "none";

    }



    // =================================
    // ORGÁNICO
    // =================================

    else if (
        clase === "organico"
    ) {


        document
        .getElementById("resultado")
        .innerHTML =

        "✅ <b>¡Este residuo va aquí!</b><br><br>" +

        "Es un residuo orgánico.<br><br>" +

        "Puedes introducirlo en este tacho.<br><br>" +

        "Precisión: " +

        Math.round(confianza) +

        "%";


        document
        .getElementById("desechar")
        .style.display =
        "inline-block";

    }



    // =================================
    // PLÁSTICO
    // =================================

    else if (
        clase === "plastico"
    ) {


        document
        .getElementById("resultado")
        .innerHTML =

        "❌ <b>Este residuo no va aquí.</b><br><br>" +

        "Es plástico.<br><br>" +

        "🧴 Busca el tacho de plásticos.<br><br>" +

        "Precisión: " +

        Math.round(confianza) +

        "%";


        document
        .getElementById("desechar")
        .style.display =
        "none";

    }



    // =================================
    // CARTÓN
    // =================================

    else if (
        clase === "carton"
    ) {


        document
        .getElementById("resultado")
        .innerHTML =

        "❌ <b>Este residuo no va aquí.</b><br><br>" +

        "Es cartón.<br><br>" +

        "📦 Busca el tacho de cartón.<br><br>" +

        "Precisión: " +

        Math.round(confianza) +

        "%";


        document
        .getElementById("desechar")
        .style.display =
        "none";

    }



    // =================================
    // CONTINUAR PARA SIEMPRE
    // =================================

    requestAnimationFrame(
        detectar
    );

}
