<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EcoSort AI</title>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #eaf7ee;
        }

        #inicio,
        #final {
            text-align: center;
            background: white;
            padding: 40px 30px;
            border-radius: 25px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.12);
        }

        h1 {
            color: #218c4a;
            font-size: 32px;
        }

        h2 {
            color: #333;
        }

        p {
            color: #555;
            font-size: 17px;
            line-height: 1.5;
        }

        button {
            background: #218c4a;
            color: white;
            border: none;
            padding: 15px 35px;
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 15px;
        }

        #app {
            text-align: center;
            width: 100%;
            padding: 20px;
        }

        #app h1 {
            color: #218c4a;
        }

        #camara {
            margin-top: 20px;
        }

        #resultado {
            background: white;
            padding: 20px;
            margin: 20px auto;
            border-radius: 15px;
            max-width: 400px;
            font-size: 18px;
            line-height: 1.4;
        }

        #desechar {
            display: none;
        }

        #final {
            display: none;
        }

    </style>

</head>


<body>


<!-- PANTALLA INICIAL -->

<div id="inicio">

    <h1>♻️ EcoSort AI</h1>

    <h2>Tacho inteligente</h2>

    <p>
        Acerca tu residuo a la cámara
        y presiona <b>COMENZAR</b>.
    </p>

    <button id="comenzar">
        COMENZAR
    </button>

</div>


<!-- APLICACIÓN -->

<div id="app" style="display:none;">

    <h1>♻️ EcoSort AI</h1>

    <div id="camara"></div>

    <div id="resultado">
        Esperando residuo...
    </div>

    <button id="desechar">
        DESECHAR
    </button>

</div>


<!-- PANTALLA FINAL -->

<div id="final">

    <h1>♻️ ¡Gracias!</h1>

    <h2>🌱 Sigue desechando responsablemente</h2>

    <p>
        Cada residuo bien separado
        ayuda a cuidar nuestro planeta.
    </p>

</div>


<script>


// MODELO DE TEACHABLE MACHINE

const URL =
"https://teachablemachine.withgoogle.com/models/y9AIk9YfX/";


// ESTE CELULAR ES EL TACHO ORGÁNICO

const TACHO = "organico";


let model = null;

let webcam = null;

let iniciada = false;

let residuoCorrecto = false;



// BOTÓN COMENZAR

document
.getElementById("comenzar")
.addEventListener("click", iniciar);



async function iniciar() {


    // Evita duplicar la cámara

    if (iniciada) {
        return;
    }


    iniciada = true;


    document
    .getElementById("inicio")
    .style.display = "none";


    document
    .getElementById("app")
    .style.display = "block";


    document
    .getElementById("resultado")
    .innerHTML =
    "⏳ Cargando modelo...";


    try {


        const modelURL =
        URL + "model.json";


        const metadataURL =
        URL + "metadata.json";


        model =
        await tmImage.load(
            modelURL,
            metadataURL
        );


        webcam =
        new tmImage.Webcam(
            300,
            300,
            true
        );


        await webcam.setup();


        await webcam.play();


        document
        .getElementById("camara")
        .appendChild(webcam.canvas);


        document
        .getElementById("resultado")
        .innerHTML =
        "📷 Cámara lista.<br><br>" +
        "Acerca un residuo.";


        detectar();


    } catch (error) {


        console.error(error);


        document
        .getElementById("resultado")
        .innerHTML =
        "❌ No se pudo iniciar la cámara.";


        iniciada = false;

    }

}



async function detectar() {


    if (!webcam || !model) {
        return;
    }


    // Si ya encontró un residuo correcto,
    // dejamos de cambiar el mensaje.

    if (residuoCorrecto) {
        return;
    }


    webcam.update();


    const predicciones =
    await model.predict(
        webcam.canvas
    );


    let mayor =
    predicciones[0];


    for (
        let i = 1;
        i < predicciones.length;
        i++
    ) {

        if (
            predicciones[i].probability >
            mayor.probability
        ) {

            mayor =
            predicciones[i];

        }

    }


    const clase =
    mayor.className.toLowerCase();


    const confianza =
    Math.round(
        mayor.probability * 100
    );


    let mensaje = "";


    // ORGÁNICO

    if (clase === "organico") {


        residuoCorrecto = true;


        mensaje =

        "✅ <b>¡Este residuo va aquí!</b><br><br>" +

        "Es un residuo orgánico.<br><br>" +

        "Puedes introducirlo en este tacho.";


        document
        .getElementById("desechar")
        .style.display = "inline-block";


    }


    // PLÁSTICO

    else if (clase === "plastico") {


        mensaje =

        "❌ <b>Este residuo no va aquí.</b><br><br>" +

        "Es plástico.<br><br>" +

        "🧴 Busca el tacho de plásticos.";


        document
        .getElementById("desechar")
        .style.display = "none";

    }


    // CARTÓN

    else if (clase === "carton") {


        mensaje =

        "❌ <b>Este residuo no va aquí.</b><br><br>" +

        "Es cartón.<br><br>" +

        "📦 Busca el tacho de cartón.";


        document
        .getElementById("desechar")
        .style.display = "none";

    }


    document
    .getElementById("resultado")
    .innerHTML =

    mensaje +

    "<br><br>" +

    "Precisión: " +

    confianza +

    "%";


    requestAnimationFrame(
        detectar
    );

}



// BOTÓN DESECHAR

document
.getElementById("desechar")
.addEventListener("click", finalizar);



function finalizar() {


    // Detener cámara

    if (webcam) {
        webcam.stop();
    }


    document
    .getElementById("app")
    .style.display = "none";


    document
    .getElementById("final")
    .style.display = "block";

}


</script>


</body>

</html>
