<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoSort AI</title>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #eaf7ee;
            padding: 25px;
        }

        h1 {
            color: #218c4a;
        }

        button {
            background: #218c4a;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;
        }

        #camera {
            margin-top: 20px;
        }

        #resultado {
            background: white;
            padding: 20px;
            margin: 20px auto;
            border-radius: 15px;
            max-width: 400px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <div id="inicio">

        <h1>♻️ EcoSort AI</h1>

        <h2>Tacho inteligente</h2>

        <p>Acerca tu residuo y presiona COMENZAR.</p>

        <button id="comenzar">
            COMENZAR
        </button>

    </div>


    <div id="app" style="display:none;">

        <h1>♻️ EcoSort AI</h1>

        <div id="camera"></div>

        <div id="resultado">
            Cargando...
        </div>

    </div>


<script>

const URL = "https://teachablemachine.withgoogle.com/models/y9AIk9YfX/";

// ESTE CELULAR ES EL TACHO ORGÁNICO
const TACHO = "organico";

let model;
let webcam;


document.getElementById("comenzar").addEventListener("click", iniciar);


async function iniciar() {

    document.getElementById("inicio").style.display = "none";
    document.getElementById("app").style.display = "block";

    document.getElementById("resultado").innerHTML =
        "⏳ Cargando cámara...";

    try {

        const modelURL = URL + "model.json";
        const metadataURL = URL + "metadata.json";

        model = await tmImage.load(modelURL, metadataURL);

        webcam = new tmImage.Webcam(300, 300, true);

        await webcam.setup();

        await webcam.play();

        document.getElementById("camera").appendChild(webcam.canvas);

        document.getElementById("resultado").innerHTML =
            "📷 Cámara lista.<br><br>Acerca un residuo.";

        window.requestAnimationFrame(loop);

    } catch (error) {

        console.error(error);

        document.getElementById("resultado").innerHTML =
            "❌ No se pudo abrir la cámara.<br><br>" +
            "Permite el acceso a la cámara y vuelve a intentarlo.";

    }
}


async function loop() {

    webcam.update();

    await predecir();

    window.requestAnimationFrame(loop);
}


async function predecir() {

    const predicciones =
        await model.predict(webcam.canvas);

    let mayor = predicciones[0];

    for (let i = 1; i < predicciones.length; i++) {

        if (
            predicciones[i].probability >
            mayor.probability
        ) {

            mayor = predicciones[i];

        }
    }

    const clase =
        mayor.className.toLowerCase();

    const confianza =
        Math.round(mayor.probability * 100);


    const nombres = {

        organico: "orgánico",
        plastico: "plástico",
        carton: "cartón"

    };


    const nombre =
        nombres[clase] || mayor.className;


    if (clase === TACHO) {

        document.getElementById("resultado").innerHTML =

            "✅ ¡Este residuo va aquí!<br><br>" +
            "Es " + nombre + ".<br><br>" +
            "Introduce tu desecho en este tacho.<br><br>" +
            "Precisión: " + confianza + "%";

    } else {

        document.getElementById("resultado").innerHTML =

            "❌ Este residuo no va aquí.<br><br>" +
            "Es " + nombre + ".<br><br>" +
            "Busca el tacho correspondiente.<br><br>" +
            "Precisión: " + confianza + "%";

    }

}

</script>

</body>
</html>
